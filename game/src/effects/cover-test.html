<!doctype html><html><head><meta charset="utf-8"><title>Low cover – 55°</title>
<style>body{margin:0;background:#111;color:#ccc;font:12px sans-serif}canvas{display:block}</style></head><body>
<canvas id="c" width="1600" height="1000"></canvas>
<script type="module">
import { drawLowCover, canDrawCover } from './cover.js';
import { PROJ } from '../shared/projection.js';
import { shadowOffset } from '../shared/light.js';
const cv = document.getElementById('c'), ctx = cv.getContext('2d'), T = 32, G = PROJ.groundScaleY;
const items = [];
const rows = [['barrier', [[3, 1], [2, 1], [1, 2], [1, 3]]], ['sandbag', [[3, 1], [2, 1], [1, 2]]], ['crates', [[2, 1], [1, 1], [3, 1]]], ['barrels', [[1, 1], [2, 1], [2, 2]]], ['tunnel', [[3, 1], [2, 1], [4, 2]]]];
function scene(ox, oy, zoom, seedBase) {
  ctx.setTransform(zoom, 0, 0, zoom * G, ox, oy);
  // gulv: mørk asfalt med striper
  ctx.fillStyle = '#34363a'; ctx.fillRect(-10, -60, 760, 980 / G);
  ctx.fillStyle = 'rgba(200,160,40,0.5)'; ctx.fillRect(-10, 6 * 32 - 8, 760, 2);
  let n = 0;
  rows.forEach(([kind, sizes], r) => {
    let x = 16;
    sizes.forEach(([w, h], i) => {
      for (let v = 0; v < 2; v++) {
        const o = { kind, id: seedBase + r * 10 + i * 2 + v, x, y: 40 + r * 4 * T, w: w * T, h: h * T, height: PROJ.heights.low };
        n += drawLowCover(ctx, o, { PROJ, time: 0, view: '55' }) ? 1 : 0; x += w * T + 14;
      }
    });
  });
  return n;
}
ctx.fillStyle = '#111'; ctx.fillRect(0, 0, cv.width, cv.height);
const a = scene(10, 20, 1, 1), b = scene(800, 20, 2, 1);
ctx.setTransform(1, 0, 0, 1, 0, 0); ctx.fillStyle = '#ddd'; ctx.fillText(`tilt ${PROJ.tiltDeg.toFixed(1)}° · zoom 1 (venstre) og 2 (høyre) · low=${PROJ.heights.low} · ok=${canDrawCover('pallet')}`, 12, 14);
window.__done = { a, b };
</script></body></html>
