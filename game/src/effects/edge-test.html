<!doctype html><html><body style="margin:0;background:#111"><canvas id="c" width="1200" height="640"></canvas><script type="module">
import { drawEdge, drawWater } from './ground.js'; import { PROJ } from '../shared/projection.js';
const ctx = document.getElementById('c').getContext('2d'), G = PROJ.groundScaleY, z = 2;

const edges = [{ kind: 'quay', side: 's', x0: 20, y0: 80, x1: 280, y1: 80 }, { kind: 'water', side: 'n', x0: 320, y0: 120, x1: 580, y1: 120 }, { kind: 'water', side: 'e', x0: 120, y0: 200, x1: 120, y1: 420 }, { kind: 'platform', side: 's', x0: 320, y0: 300, x1: 580, y1: 300 }, { kind: 'platform', side: 'w', x0: 320, y0: 300, x1: 320, y1: 500 }];
