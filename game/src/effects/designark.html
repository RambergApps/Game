<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>BREACH – VFX sheet</title>
<style>html,body{margin:0;background:#0b0c0d}canvas{display:block}</style></head>
<body><canvas id="c"></canvas>
<script type="module">
import { SCENES, simulate, drawScene, ground } from './scenes.js';
import { warmup } from './sprites.js';
import * as FX from './index.js';
const W = 2400, PAD = 18, COLS = 4, HEAD = 120, CW = (W - PAD * (COLS + 1)) / COLS, CH = 470, LAB = 54, ROWS = 3, H = HEAD + ROWS * (CH + LAB + PAD) + PAD + 40;
const cv = document.getElementById('c'); cv.width = W; cv.height = H; const ctx = cv.getContext('2d');
warmup();
ctx.fillStyle = '#0d0e10'; ctx.fillRect(0, 0, W, H);
ctx.fillStyle = '#e8edf1'; ctx.font = '700 46px "Barlow Condensed", "Arial Narrow", system-ui'; ctx.fillText('BREACH', PAD, 62);
ctx.fillStyle = '#e5533d'; ctx.fillText('//', PAD + ctx.measureText('BREACH ').width - 6, 62);
ctx.fillStyle = '#e8edf1'; ctx.font = '600 30px "Barlow Condensed", "Arial Narrow", system-ui'; ctx.fillText('VFX SHEET v1 — WEAPONS, IMPACTS, CINDERBORN', PAD + 190, 60);
ctx.fillStyle = '#8f99a3'; ctx.font = '500 17px system-ui'; ctx.fillText('Painted canvas VFX, oblique 3/4 view (PROJ zScale 0.75), drawn by game/src/effects. Panels at 3× zoom with a game-scale (1.5×) inset; explosion at game scale. Muzzle flashes and tracers are owned by Weapons and shown here as reference only.', PAD, 96);
const slots = [[0,0],[1,0],[2,0],[3,0],[0,1],[1,1],[2,1],[3,1],[0,2,2],[2,2],[3,2]];
SCENES.forEach((sc, i) => {
  const [c, r, span = 1] = slots[i], x = PAD + c * (CW + PAD), y = HEAD + r * (CH + LAB + PAD), w = CW * span + PAD * (span - 1);
  ctx.fillStyle = '#16181b'; ctx.fillRect(x, y, w, CH + LAB);
  ctx.fillStyle = '#d9dee2'; ctx.font = '700 22px "Barlow Condensed", "Arial Narrow", system-ui'; ctx.fillText(sc.title, x + 14, y + 26);
  ctx.fillStyle = '#7f8a94'; ctx.font = '500 14px system-ui'; ctx.fillText(sc.sub, x + 14, y + 46);
  const py = y + LAB;
  if (sc.snaps) {
    const n = sc.snaps.length, sw = (w - (n - 1) * 4) / n;
    sc.snaps.forEach((t, k) => { const wd = simulate(sc, t); const sx = x + k * (sw + 4); drawScene(ctx, sc, wd, sx, py, sw, CH, sc.zoom, ground(Math.round(sw), CH, sc.seed, 'concrete', sc.zoom));
      ctx.fillStyle = 'rgba(10,11,12,.7)'; ctx.fillRect(sx + 8, py + CH - 30, 70, 22); ctx.fillStyle = '#c9d1d8'; ctx.font = '600 14px system-ui'; ctx.fillText(`t = ${t.toFixed(2)} s`, sx + 14, py + CH - 14); });
  } else {
    const wd = simulate(sc, sc.snap); drawScene(ctx, sc, wd, x, py, w, CH);
    // innfelt i spillskala
    const iw = 170, ih = 130, ix = x + w - iw - 10, iy = py + CH - ih - 10;
    ctx.fillStyle = '#0b0c0d'; ctx.fillRect(ix - 2, iy - 2, iw + 4, ih + 4);
    drawScene(ctx, sc, wd, ix, iy, iw, ih, 1.5);
    ctx.fillStyle = 'rgba(10,11,12,.75)'; ctx.fillRect(ix, iy, 74, 18); ctx.fillStyle = '#aeb7bf'; ctx.font = '600 12px system-ui'; ctx.fillText('GAME 1.5×', ix + 6, iy + 13);
  }
});
ctx.fillStyle = '#5d666e'; ctx.font = '500 14px system-ui';
ctx.fillText('Pooled particles (hard cap 900 + 140 decals), cached sprites/gradients, no shadowBlur. Additive blending only for fire, glow, sparks and hot ichor. Cosmetic RNG (world.rng untouched).', PAD, H - 18);
window.__done = true;
</script></body></html>
