<!doctype html>
<html lang="no">
<head>
<link rel="icon" href="data:,">
<meta charset="utf-8">
<title>BREACH – levels testside</title>
<style>
  html, body { margin: 0; height: 100%; background: #0a0b0d; color: #d9d4c7; font: 13px/1.4 system-ui, sans-serif; }
  #wrap { display: grid; grid-template-columns: 1fr 340px; height: 100%; }
  iframe { width: 100%; height: 100%; border: 0; background: #000; }
  aside { display: flex; flex-direction: column; gap: 8px; padding: 10px; border-left: 1px solid #222; min-height: 0; }
  h1 { font-size: 14px; letter-spacing: 3px; margin: 0 0 4px; color: #ffb347; }
  label { display: flex; gap: 6px; align-items: center; }
  select, button { background: #16181b; color: #e8e2d4; border: 1px solid #333; padding: 5px 8px; font: inherit; }
  button:hover { border-color: #ffb347; cursor: pointer; }
  .row { display: flex; gap: 6px; flex-wrap: wrap; }
  #log { flex: 1; min-height: 0; overflow: auto; background: #060708; border: 1px solid #222; padding: 6px; font: 11px/1.35 ui-monospace, monospace; white-space: pre-wrap; }
  #log .t { color: #6b7380; } #log .k { color: #39c6ff; } #log .w { color: #ffb347; }
  small { color: #8a8f96; }
</style>
</head>
<body>
<div id="wrap">
  <iframe id="game" src="../../index.html"></iframe>
  <aside>
    <h1>LEVELS TEST</h1>
    <small>Spillet kjører i rammen til venstre. Velg nivå og bølge og trykk Start (bruker startLevel(world, n, {startAt})).</small>
    <label>Nivå <select id="lvl"></select></label>
    <label>Bølge <select id="wave"></select></label>
    <label><input type="checkbox" id="skipcs"> Hopp over alle mellomsekvenser</label>
    <label><input type="checkbox" id="god"> Udødelig (invuln)</label>
    <div class="row">
      <button id="start">Start</button>
      <button id="kill">Drep alle fiender</button>
      <button id="die">Død</button>
      <button id="restartw" title="restartWave(world, {cause:'menu'}) – det pausemenyens RESTART WAVE kaller">Restart wave</button>
    </div>
    <div class="row">
      <button id="next">Fullfør bølgen</button>
      <button id="fallen">Nullstill «fallen sett»</button>
      <button id="credits">Rulletekst</button>
      <button id="clear">Tøm logg</button>
    </div>
    <div id="log"></div>
  </aside>
</div>
<script type="module">
import { LEVELS } from './data.js';
const $ = (id) => document.getElementById(id);
const frame = $('game'), log = $('log');
const lvl = $('lvl'), wave = $('wave');
for (const L of LEVELS) lvl.add(new Option(`${L.n} · ${L.name}`, L.n));
const fillWaves = () => { wave.innerHTML = ''; for (const w of LEVELS[lvl.value - 1].waves) wave.add(new Option(`${w.id} · ${w.name}${w.type === 'boss' ? ' (boss)' : ''}`, w.id)); };
lvl.onchange = fillWaves; fillWaves();

const EVENTS = ['levelStart', 'waveStart', 'waveEnd', 'levelEnd', 'upgrade', 'restart', 'gameComplete', 'bossStart', 'bossPhase', 'bossDefeated', 'bossEnd',
  'cutsceneStart', 'cutsceneLine', 'cutsceneEnd', 'creditsStart', 'creditsEnd', 'spawnWarn', 'spawnRise', 'death'];
const t0 = performance.now();
function line(kind, data, cls = 'k') {
  const d = document.createElement('div');
  d.innerHTML = `<span class="t">${((performance.now() - t0) / 1000).toFixed(1).padStart(6)}</span> <span class="${cls}">${kind}</span> `;
  d.append(document.createTextNode(data));
  log.append(d); log.scrollTop = log.scrollHeight;
}
const B = () => frame.contentWindow.BREACH;
let hooked = null;
function hook() {
  const W = B()?.world; if (!W || hooked === W) return !!W;
  hooked = W;
  for (const k of EVENTS) W.events.on(k, (d) => {
    let s = '';
    try { s = k === 'death' ? `${d?.target?.team || '?'}${d?.target?.type ? ':' + d.target.type : ''}` : JSON.stringify(d ?? {}); } catch { s = '…'; }
    line(k, s.length > 140 ? s.slice(0, 140) + '…' : s);
  });
  const c = frame.contentWindow.console, info = c.info.bind(c), warn = c.warn.bind(c);
  c.info = (...a) => { line('info', a.map(String).join(' '), 'w'); info(...a); };
  c.warn = (...a) => { line('warn', a.map(String).join(' '), 'w'); warn(...a); };
  line('ready', 'world koblet til');
  return true;
}
frame.addEventListener('load', () => { const iv = setInterval(() => { if (hook()) clearInterval(iv); }, 100); });

$('start').onclick = () => {
  if (!hook()) return line('feil', 'spillet er ikke lastet ennå', 'w');
  const doc = frame.contentDocument, W = B().world;
  doc.getElementById('start-screen')?.remove(); W.paused = false;
  W.modules.levels.startLevel(W, +lvl.value, { startAt: wave.value, skipCutscenes: $('skipcs').checked });
  if (W.player) W.player.invuln = $('god').checked;
  frame.focus();
};
$('god').onchange = () => { const p = B()?.world?.player; if (p) p.invuln = $('god').checked; };
$('kill').onclick = async () => {
  const W = B()?.world; if (!W) return;
  const { damage } = await frame.contentWindow.eval("import('/src/core/index.js')");
  let n = 0; for (const e of [...W.enemies]) if (!e.dead) { damage(e, 99999, W.player, W); n++; }
  line('test', `drepte ${n} fiender`, 'w'); frame.focus();
};
$('die').onclick = async () => {
  const W = B()?.world; if (!W?.player) return;
  W.player.invuln = false; $('god').checked = false;
  const { damage } = await frame.contentWindow.eval("import('/src/core/index.js')");
  damage(W.player, 99999, null, W); frame.focus();
};
$('restartw').onclick = () => {
  const W = B()?.world; if (!W) return;
  const ok = W.modules.levels.restartWave(W, { cause: 'menu' });
  line('test', `restartWave → ${ok}${ok ? '' : ' (ingen aktiv bølge)'}`, 'w'); frame.focus();
};
$('next').onclick = () => {
  const W = B()?.world; if (!W) return;
  const d = W.modules.levels._debug(W);
  if (d.hold) d.hold.t = d.hold.need;
  else { d.queue = []; for (const e of W.enemies) e.dead = true; W.events.emit('bossDefeated', {}); }
  line('test', 'fullfører bølgen', 'w'); frame.focus();
};
$('fallen').onclick = () => { const L = B()?.world?.modules.levels; L?.setFallenSeen(false); line('test', 'fallen vises ved neste død', 'w'); };
$('credits').onclick = () => { const W = B()?.world; W?.modules.story.showCredits({ world: W }); frame.focus(); };
$('clear').onclick = () => { log.innerHTML = ''; };
</script>
</body>
</html>
